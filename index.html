<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Pro</title>
    <script>
      /* 首屏主题预加载：在应用挂载前同步持久化的深色模式与侧边栏配色，
         避免暗色用户刷新时先渲染白底再切换的闪烁（FOUC）。
         键名与 store persist key（appStore persist.key）保持一致。 */
      (function () {
        try {
          var raw = localStorage.getItem("app-store-nexus-sync");
          var settings = raw ? JSON.parse(raw).layoutSettings || {} : {};
          var root = document.documentElement;
          if (settings.isDark) root.classList.add("dark");
          root.dataset.sidebar = settings.sidebarTheme || "light";
        } catch (e) {
          /* 解析失败按默认浅色渲染 */
        }
      })();
    </script>
    <style>
      /* 首屏加载 splash：应用挂载前占位，避免白屏/黑屏闪烁；
         Vue mount 时会整体替换 #app 内容，无需手动移除 */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f8;
        z-index: 9999;
      }
      html.dark .boot-splash {
        background: #0b1120;
      }
      .boot-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #2563eb, #1e4fbc);
        box-shadow: 0 8px 24px rgb(37 99 235 / 35%);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-logo">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.5 18.5V5.5L17.5 18.5V5.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
